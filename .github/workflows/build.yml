name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Setup roothide package format
        run: |
          export THEOS=$HOME/theos

          printf '%s\n' \
            '_THEOS_PACKAGE_FORMAT_LOADED := 1' \
            '' \
            'ifneq ($(THEOS_PACKAGE_ARCH),iphoneos-arm64e)' \
            '	THEOS_PACKAGE_ARCH := iphoneos-arm64e' \
            'endif' \
            '' \
            'include $(THEOS_MAKE_PATH)/package/deb.mk' \
            > $THEOS/makefiles/package/roothide.mk

          echo "=== roothide.mk ==="
          cat $THEOS/makefiles/package/roothide.mk

          echo "=== roothide instance 文件列表 ==="
          ls -la $THEOS/vendor/mod/roothide/instance/

          echo "=== 备份并强制覆盖 instance 规则 ==="
          cp -f $THEOS/vendor/mod/roothide/instance/rules.mk $THEOS/makefiles/instance/rules.mk
          cp -f $THEOS/vendor/mod/roothide/instance/library.mk $THEOS/makefiles/instance/library.mk
          cp -f $THEOS/vendor/mod/roothide/instance/framework.mk $THEOS/makefiles/instance/framework.mk

          echo "=== 覆盖后 rules.mk 前 20 行 ==="
          head -20 $THEOS/makefiles/instance/rules.mk

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
