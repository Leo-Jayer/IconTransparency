name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Setup roothide package format
        run: |
          export THEOS=$HOME/theos
          echo "=== vendor/mod/roothide ==="
          ls -la $THEOS/vendor/mod/roothide/
          echo "=== 查找 roothide.mk ==="
          find $THEOS/vendor -name "roothide.mk" 2>/dev/null
          find $THEOS/vendor/mod/roothide -type f 2>/dev/null

          # 如果 vendor/mod/roothide 里有 roothide.mk，复制到 makefiles/package/
          if [ -f $THEOS/vendor/mod/roothide/roothide.mk ]; then
            cp $THEOS/vendor/mod/roothide/roothide.mk $THEOS/makefiles/package/roothide.mk
            echo "已复制 roothide.mk"
          else
            echo "vendor/mod/roothide/roothide.mk 不存在，尝试其他位置"
            # 尝试在 vendor 里找
            find $THEOS/vendor -name "*.mk" -path "*roothide*" -exec cp {} $THEOS/makefiles/package/roothide.mk \;
          fi

          echo "=== makefiles/package/ 现在的内容 ==="
          ls -la $THEOS/makefiles/package/

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
