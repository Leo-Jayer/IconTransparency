name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Debug roothide internals
        run: |
          export THEOS=$HOME/theos
          echo "=== 原始 deb.mk ==="
          cat $THEOS/vendor/mod/roothide/package/deb.mk
          echo ""
          echo "=== 原始 package.mk ==="
          cat $THEOS/vendor/mod/roothide/package.mk
          echo ""
          echo "=== Theos 主 package.mk 中 _THEOS_PACKAGE_FORMAT 相关 ==="
          grep -n "_THEOS_PACKAGE_FORMAT" $THEOS/makefiles/package.mk

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
