name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Inspect roothide Theos package tools
        run: |
          export THEOS=$HOME/theos
          echo "=== bin ==="
          ls -la $THEOS/bin/
          echo "=== makefiles/package ==="
          ls -la $THEOS/makefiles/package/ 2>/dev/null || echo "no package dir"
          echo "=== makefiles/package.mk ==="
          cat $THEOS/makefiles/package.mk 2>/dev/null | head -60
          echo "=== find roothide tools ==="
          find $THEOS -maxdepth 3 -iname "*roothide*" 2>/dev/null

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
