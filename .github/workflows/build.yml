name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install roothide Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS 16.2 SDK
        run: |
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
