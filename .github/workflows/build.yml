name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          ls -la $THEOS/

      - name: Install roothide package tools
        run: |
          export THEOS=$HOME/theos
          # roothide 的打包工具在 roothide/roothide 仓库里
          git clone --depth 1 https://github.com/roothide/roothide.git /tmp/roothide
          ls /tmp/roothide/
          # 找到打包脚本，复制到 $THEOS/bin
          find /tmp/roothide -maxdepth 2 -type f -name "*package*" -o -name "*roothide*" | head -20
          # 常见做法：从 roothide-package 克隆
          git clone --depth 1 https://github.com/roothide/roothide-package.git /tmp/roothide-package 2>/dev/null || true
          ls /tmp/roothide-package/ 2>/dev/null || echo "roothide-package not found"

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
