name: Build Tweak (roothide)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz dpkg

      - name: Clone roothide Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Setup roothide package format
        run: |
          export THEOS=$HOME/theos

          # 删掉之前错误的 roothide.mk
          rm -f $THEOS/makefiles/package/roothide.mk

          # 复制正确的 roothide 打包规则
          cp $THEOS/vendor/mod/roothide/package/deb.mk $THEOS/makefiles/package/roothide.mk

          echo "=== roothide.mk 前 30 行 ==="
          head -30 $THEOS/makefiles/package/roothide.mk

          # 覆盖 instance 规则，让 roothide 生效
          cp $THEOS/vendor/mod/roothide/instance/*.mk $THEOS/makefiles/instance/ 2>/dev/null || true

          echo "=== makefiles/package/ ==="
          ls -la $THEOS/makefiles/package/

      - name: Download iOS 16.2 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cp -r /tmp/ios-sdks/iPhoneOS16.2.sdk $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build roothide Package
        run: |
          export THEOS=$HOME/theos
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: IconTransparency-roothide-deb
          path: packages/*.deb
